<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>کارت دیجیتال</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page{min-height:100vh;position:relative;overflow:hidden;padding-bottom:44px}
.cover{position:absolute;top:0;left:0;right:0}
.card{position:relative;width:100%;max-width:460px;margin:0 auto;padding:0 16px}
.box{animation:up .5s ease both}
.avatar{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:40px;width:100px;height:100px;border-radius:50%;margin:0 auto 14px}
.head{text-align:center}
h1{font-size:25px;line-height:1.35;margin:0;font-weight:800}
.sub{opacity:.72;font-size:14px;margin-top:4px}
.bio{font-size:14px;line-height:1.95;opacity:.86;margin:12px 0 0;padding:0 8px;text-align:center;word-wrap:break-word;overflow-wrap:break-word}
.quick{display:flex;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.q{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px 7px}
.q svg{width:22px;height:22px}
.save{display:flex;align-items:center;justify-content:center;margin:14px 0 4px;padding:14px;border-radius:16px;font-weight:700;font-size:15px}
.save svg{width:20px;height:20px;margin-left:8px}
.row{display:flex;align-items:center;padding:12px 14px;border-radius:16px;margin-top:10px}
.ico{flex-shrink:0;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-left:12px}
.ico svg{width:19px;height:19px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{display:block;font-size:12px;opacity:.62;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.chev{flex-shrink:0;width:18px;height:18px;opacity:.4}
.note{margin:26px 8px 0;text-align:center;font-size:12px;opacity:.55}
/* t0 aurora glass */
.t0{background:#0b1020;color:#f2f5ff}
.t0 .cover{height:100%;bottom:0;background:radial-gradient(60% 38% at 15% 0%,var(--a) 0,transparent 62%),radial-gradient(50% 36% at 95% 18%,var(--a2) 0,transparent 58%);opacity:.38}
.t0 .card{padding-top:52px}
.t0 .avatar{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.t0 .q,.t0 .row{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.t0 .q{color:var(--a2)}
.t0 .ico{background:rgba(255,255,255,.1);color:var(--a2)}
.t0 .save{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on);box-shadow:0 10px 28px rgba(0,0,0,.3)}
/* t1 minimal */
.t1{background:#fff;color:#111}
.t1 .cover{display:none}
.t1 .card{padding-top:58px}
.t1 .avatar{border-radius:30px;background:#111;color:#fff;width:90px;height:90px}
.t1 h1{font-size:28px;letter-spacing:-.3px}
.t1 .q{background:#f3f4f6;color:#111}
.t1 .row{background:#fff;border:1px solid #e5e7eb}
.t1 .ico{background:#f3f4f6;color:#111}
.t1 .save{background:var(--a);color:var(--on)}
/* t2 luxe */
.t2{background:#0a0a0a;color:#f5efe0}
.t2 .cover{height:260px;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent)}
.t2 .card{padding-top:54px}
.t2 .avatar{border:2px solid var(--a);background:#111;color:var(--a);box-shadow:0 0 0 6px rgba(255,255,255,.04)}
.t2 h1{letter-spacing:.4px}
.t2 .q{border:1px solid var(--a);color:var(--a);background:transparent}
.t2 .row{background:#141414;border:1px solid #2b2b2b}
.t2 .ico{color:var(--a);background:transparent;border:1px solid var(--a)}
.t2 .save{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on)}
/* t3 gradient pop */
.t3{background:#f2f3f8;color:#14161f}
.t3 .cover{height:230px;background:linear-gradient(135deg,var(--a),var(--a2))}
.t3 .card{padding-top:128px}
.t3 .box{background:#fff;border-radius:30px;padding:0 16px 22px;box-shadow:0 16px 44px rgba(20,22,31,.14)}
.t3 .avatar{margin-top:-52px;border:5px solid #fff;background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on)}
.t3 .head{padding-top:0}
.t3 .q{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on)}
.t3 .row{background:#f5f6fb}
.t3 .ico{background:#fff;color:var(--a)}
.t3 .save{background:#14161f;color:#fff}
/* t4 corporate */
.t4{background:#eceff5;color:#0f172a}
.t4 .cover{height:200px;background:var(--a)}
.t4 .cover:after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0,rgba(255,255,255,.09) 12px,transparent 12px,transparent 24px)}
.t4 .card{padding-top:116px}
.t4 .box{background:#fff;border-radius:16px;padding:0 16px 22px;box-shadow:0 8px 28px rgba(15,23,42,.12)}
.t4 .avatar{margin-top:-48px;width:96px;height:96px;border-radius:20px;border:4px solid #fff;background:var(--a2);color:var(--on)}
.t4 .q{border-radius:12px;background:#eceff5;color:var(--a)}
.t4 .row{border-radius:10px;background:#fff;border:1px solid #e2e8f0;border-right:4px solid var(--a)}
.t4 .ico{border-radius:10px;background:#eceff5;color:var(--a)}
.t4 .save{border-radius:10px;background:var(--a);color:var(--on)}
/* t5 soft */
.t5{background:#e9edf5;color:#2b3350}
.t5 .cover{display:none}
.t5 .card{padding-top:46px}
.t5 .avatar{background:#e9edf5;color:var(--a);box-shadow:9px 9px 20px #cdd3e2,-9px -9px 20px #fff}
.t5 .q,.t5 .row,.t5 .save{background:#e9edf5;border:0;box-shadow:7px 7px 16px #cdd3e2,-7px -7px 16px #fff}
.t5 .q{color:var(--a)}
.t5 .ico{background:transparent;color:var(--a)}
.t5 .save{color:var(--a)}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="text-align:center;font-family:sans-serif;margin-top:40px">برای دیدن این کارت جاوااسکریپت باید فعال باشد.</p></noscript>
<script>/*CARD_DATA*/</script>
<script>
(function () {
  var ACC = [
    ["#D8B76A", "#F3DB9C", "#1B1405"], ["#2563EB", "#60A5FA", "#FFFFFF"], ["#10B981", "#6EE7B7", "#04281D"],
    ["#F43F5E", "#FB7185", "#FFFFFF"], ["#8B5CF6", "#C4B5FD", "#FFFFFF"], ["#F97316", "#FDBA74", "#2A1204"],
    ["#14B8A6", "#5EEAD4", "#032421"], ["#334155", "#94A3B8", "#FFFFFF"]
  ];
  var ICONS = {
    phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
    mail: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
    globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    user: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>',
    insta: '<rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
    linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
    send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
    chat: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    chev: '<polyline points="15 18 9 12 15 6"/>'
  };

  function svg(n) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[n] + '</svg>';
  }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null) e.textContent = txt;
    return e;
  }
  function icon(cls, name) { var s = el('span', cls); s.innerHTML = svg(name); return s; }

  // ---- payload decoding ----
  function b64ToBytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), a = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function bytesToStr(a) {
    var s = '', i;
    for (i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    try { return decodeURIComponent(escape(s)); } catch (e) { return s; }
  }
  function decodePayload(p, cb) {
    try {
      var kind = p.charAt(0), bytes = b64ToBytes(p.slice(1));
      if (kind === 'u') { cb(null, bytesToStr(bytes)); return; }
      if (kind === 'z') {
        if (typeof DecompressionStream === 'undefined' || typeof Response === 'undefined') { cb('old'); return; }
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        new Response(stream).arrayBuffer().then(function (buf) { cb(null, bytesToStr(new Uint8Array(buf))); }, function () { cb('bad'); });
        return;
      }
      cb('bad');
    } catch (e) { cb('bad'); }
  }
  function parse(str) {
    var f = str.split('\u001f'), v = f.slice(2), i;
    for (i = 0; i < 13; i++) if (v[i] === undefined) v[i] = '';
    return { t: parseInt(f[0], 10) || 0, a: parseInt(f[1], 10) || 0, v: v };
  }

  // ---- helpers ----
  function fixUrl(u) { u = (u || '').replace(/^\s+|\s+$/g, ''); return /^https?:\/\//i.test(u) ? u : (u ? 'https://' + u : ''); }
  function social(base, v) { if (/^https?:\/\//i.test(v)) return v; return base + encodeURIComponent(v.replace(/^@/, '')); }
  function digits(s) { return (s || '').replace(/[^0-9]/g, ''); }
  function host(u) { return u.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0]; }
  function vesc(s) { return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
  function vcard(v) {
    var L = ['BEGIN:VCARD', 'VERSION:3.0', 'N:;' + vesc(v[0] || '-') + ';;;', 'FN:' + vesc(v[0] || '-')];
    if (v[2]) L.push('ORG:' + vesc(v[2]));
    if (v[1]) L.push('TITLE:' + vesc(v[1]));
    if (v[4]) L.push('TEL;TYPE=CELL:' + vesc(v[4]));
    if (v[5]) L.push('EMAIL:' + vesc(v[5]));
    if (v[6]) L.push('URL:' + vesc(fixUrl(v[6])));
    if (v[11]) L.push('ADR;TYPE=WORK:;;' + vesc(v[11]) + ';;;;');
    if (v[3]) L.push('NOTE:' + vesc(v[3]));
    L.push('END:VCARD');
    return L.join('\r\n') + '\r\n';
  }
  function customLinks(text) {
    var out = [], lines = (text || '').split('\n'), i, ln, k, label, url;
    for (i = 0; i < lines.length; i++) {
      ln = lines[i].replace(/^\s+|\s+$/g, '');
      if (!ln) continue;
      k = ln.lastIndexOf('|');
      if (k >= 0) { label = ln.slice(0, k).replace(/\s+$/, ''); url = fixUrl(ln.slice(k + 1)); }
      else { url = fixUrl(ln); label = host(url); }
      if (url) out.push([label || host(url), url]);
    }
    return out;
  }

  function render(card) {
    var v = card.v, acc = ACC[card.a] || ACC[0], tpl = card.t >= 0 && card.t <= 5 ? card.t : 0;
    var app = document.getElementById('app');
    app.innerHTML = '';
    var page = el('div', 'page t' + tpl);
    page.style.setProperty('--a', acc[0]);
    page.style.setProperty('--a2', acc[1]);
    page.style.setProperty('--on', acc[2]);
    page.appendChild(el('div', 'cover'));
    var wrap = el('div', 'card'), box = el('div', 'box');
    var name = v[0] || 'کارت دیجیتال';
    var first = name.charAt(0);
    var av = el('div', 'avatar', first);
    box.appendChild(av);
    var head = el('div', 'head');
    head.appendChild(el('h1', '', name));
    var sub = v[1];
    if (v[2]) sub = sub ? sub + ' · ' + v[2] : v[2];
    if (sub) head.appendChild(el('div', 'sub', sub));
    box.appendChild(head);
    if (v[3]) box.appendChild(el('p', 'bio', v[3]));

    var quick = el('div', 'quick'), qn = 0;
    function q(name, href, label) {
      var a = el('a', 'q'); a.href = href; a.setAttribute('aria-label', label);
      a.innerHTML = svg(name);
      if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
      quick.appendChild(a); qn++;
    }
    if (v[4]) q('phone', 'tel:' + v[4].replace(/\s/g, ''), 'تماس');
    if (v[9]) q('chat', 'https://wa.me/' + digits(v[9]), 'واتساپ');
    if (v[8]) q('send', social('https://t.me/', v[8]), 'تلگرام');
    if (v[7]) q('insta', social('https://instagram.com/', v[7]), 'اینستاگرام');
    if (v[5]) q('mail', 'mailto:' + v[5], 'ایمیل');
    if (qn) box.appendChild(quick);

    var save = el('a', 'save');
    save.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcard(v));
    save.setAttribute('download', 'contact.vcf');
    save.innerHTML = svg('user');
    save.appendChild(el('span', '', 'ذخیره در مخاطبین'));
    box.appendChild(save);

    function row(name, title, subtitle, href) {
      var a = el('a', 'row'); a.href = href;
      if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
      a.appendChild(icon('ico', name));
      var rt = el('div', 'rt'); rt.appendChild(el('b', '', title));
      if (subtitle) rt.appendChild(el('small', '', subtitle));
      a.appendChild(rt);
      a.appendChild(icon('chev', 'chev'));
      box.appendChild(a);
    }
    if (v[6]) row('globe', 'وب‌سایت', host(fixUrl(v[6])), fixUrl(v[6]));
    if (v[10]) { var li = /^https?:/i.test(v[10]) ? v[10] : 'https://linkedin.com/in/' + encodeURIComponent(v[10]); row('linkedin', 'لینکدین', host(li), li); }
    if (v[11]) row('pin', 'آدرس', v[11], 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(v[11]));
    var cl = customLinks(v[12]), i;
    for (i = 0; i < cl.length; i++) row('link', cl[i][0], host(cl[i][1]), cl[i][1]);

    wrap.appendChild(box);
    page.appendChild(wrap);
    app.appendChild(page);
    document.title = name;
  }

  function message(txt) {
    var app = document.getElementById('app');
    app.innerHTML = '';
    var d = el('div', '', txt);
    d.style.cssText = 'text-align:center;font-family:sans-serif;padding:60px 24px;color:#445';
    app.appendChild(d);
  }

  var DEMO = '1\u001f1\u001fنمونه کارت\u001fمدیر محصول\u001fشرکت شما\u001fاین یک کارت نمونه است. کارت خودتان را در برنامه بسازید و لینکش را به اشتراک بگذارید.\u001f09120000000\u001fname@example.com\u001fexample.com\u001fmy_id\u001fmy_id\u001f989120000000';

  function run() {
    var raw = (window.__CARD__ || (location.hash || '').replace(/^#/, '')).replace(/[^A-Za-z0-9_\-]/g, '');
    if (!raw) { render(parse(DEMO)); return; }
    decodePayload(raw, function (err, str) {
      if (err === 'old') { message('مرورگر شما قدیمی است؛ لطفاً مرورگر را به‌روز کنید یا با Chrome باز کنید.'); return; }
      if (err) { message('این لینک کارت معتبر نیست.'); return; }
      render(parse(str));
    });
  }

  if (typeof document !== 'undefined') { run(); window.addEventListener('hashchange', run); }
  else if (typeof module !== 'undefined') { module.exports = { decodePayload: decodePayload, parse: parse, customLinks: customLinks, vcard: vcard }; }
})();
</script>
</body>
</html>
